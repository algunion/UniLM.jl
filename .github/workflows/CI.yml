name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - HTTP ${{ matrix.http }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    env:
      UNILM_RUN_IMAGE_TESTS: 'false'  # image generation is billed per image; opt-in only
      # HTTP.jl ≥ 2.6.2 schedules server tasks on the interactive thread pool
      # (JuliaWeb/HTTP.jl#1342). Give that pool dedicated OS threads so the
      # in-process mock servers the suite spawns are never starved by
      # test-side work: the hang-matrix idle-gap contracts assert
      # second-scale margins that scheduling contention on a shared thread
      # can blow nondeterministically. Public-repo Linux runners have 4
      # vCPUs; use them.
      JULIA_NUM_THREADS: '4,2'
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'  # latest stable release
          # When latest stable moves past the `julia` compat floor in
          # Project.toml (1.12 as of 2026-08), add the floor version here as a
          # second leg — otherwise the floor we advertise goes untested.
          #- 'nightly' (JET fails for some reason on nightly)
        http:  # exercise both ends of the `HTTP = "1.9, 2"` compat range
          - '1'
          - '2'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Pin HTTP to major ${{ matrix.http }}
        run: julia --project=. -e 'using Pkg; Pkg.add(PackageSpec(name="HTTP", version="${{ matrix.http }}")); Pkg.status("HTTP")'
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          disable_search: true
