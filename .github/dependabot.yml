# Weekly update pull requests for the package, its test and docs environments,
# and the workflow actions (pinned to commit SHAs with the version as a comment).
version: 2
updates:
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/test"
      - "/docs"
    schedule:
      interval: "weekly"
    # Propose a release only once it has been public for a week, so a
    # compromised version has time to be caught and yanked upstream first.
    cooldown:
      default-days: 7
    # The test and docs environments always load the package from this
    # checkout, so a compat bound on UniLM there would only stop them from
    # resolving at the next version bump.
    ignore:
      - dependency-name: "UniLM"
    groups:
      julia:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # The documentation site. An upgrade of `next` must pass CI before it is merged: the
  # site's build relies on one of Next's internals.
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # The pages @markdoc/next.js compiles import js-yaml's default export from the
      # site's own js-yaml, and js-yaml 5 has named exports only.
      - dependency-name: "js-yaml"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.72.0, which eslint-config-next brings in, declares a peer
      # typescript below 6.1.0, and `npm run lint` fails under TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The site builds and lints on the Node 22 its workflow sets up, so its Node
      # types follow Node 22's major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      site:
        patterns: ["*"]
