name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
# The job token only reads the repository; the coverage upload authenticates
# with its own token.
permissions:
  contents: read
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    env:
      UNILM_RUN_IMAGE_TESTS: 'false'  # image generation is billed per image; opt-in only
      # HTTP.jl ≥ 2.6.2 schedules server tasks on the interactive thread pool
      # (JuliaWeb/HTTP.jl#1342). Give that pool dedicated OS threads so the
      # in-process mock servers the suite spawns are never starved by
      # test-side work: the hang-matrix idle-gap contracts assert
      # second-scale margins that scheduling contention on a shared thread
      # can blow nondeterministically. Public-repo Linux runners have 4
      # vCPUs; use them.
      JULIA_NUM_THREADS: '4,2'
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'  # latest stable release
          # When latest stable moves past the `julia` compat floor in
          # Project.toml (1.13), add the floor version here as a
          # second leg — otherwise the floor we advertise goes untested.
          #- 'nightly' (JET fails for some reason on nightly)
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@e32267b41e0fa7df82a3d53e8c7273620d52c586 # v3.4.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0
      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1.2.2
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          disable_search: true
