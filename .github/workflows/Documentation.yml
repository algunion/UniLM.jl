name: Documentation
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  # Allow manual (re)builds for any ref — e.g. to (re)deploy versioned docs for a
  # release tag whose TagBot push did not trigger this workflow.
  workflow_dispatch:
    inputs:
      live_examples:
        description: Run billed examples using configured provider API keys
        type: boolean
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        run: |
          julia --project=docs/ -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      # Automatic builds and releases render examples without provider keys.
      # Live examples incur API spend and require an explicit manual opt-in.
      - name: Build and deploy (offline examples)
        if: github.event_name != 'workflow_dispatch' || !inputs.live_examples
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs/ docs/make.jl
      - name: Build and deploy (live examples)
        if: github.event_name == 'workflow_dispatch' && inputs.live_examples
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: julia --project=docs/ docs/make.jl
