# Links into earlier versions of the documentation site that keep working after a page or an anchor moves;
# docs/redirects.jl reads this file once the site is built.
#
# [routes]   old route = the route that replaced it, e.g. "guide/responses_api" = "providers/openai/responses".
#            A stub at the old route forwards its readers there, to the anchor they followed where it still exists.
# [anchors]  retired anchor id = its successor, an id that a page of the site defines.
[routes]
"guide/responses_api" = "providers/openai/responses"
"guide/retrieval" = "providers/openai/retrieval"
"guide/ollama" = "providers/ollama"
"guide/jev_start" = "decisions/jev"
"guide/system_one_backends" = "decisions/choosing"

[anchors]
backends_ollama = "ollama_decisions_start"
backends_ollama_images = "ollama_decisions_images"
backends_ollama_limits = "ollama_decisions_limits"
backends_ollama_models = "ollama_decisions_models"
backends_openai = "openai_decisions_start"
backends_recordings = "backends_table"
