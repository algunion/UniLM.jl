name: Release gate
# This workflow must be green before a release is registered.
# JET runs a whole-package type-stability analysis that is expensive, so it is
# restricted to release branches and manual dispatch instead of running on every
# push or pull request.
on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-gate:
    name: JET whole-package gate (latest stable Julia)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # HTTP.jl ≥ 2.6.2 schedules server tasks on the interactive thread pool
      # (JuliaWeb/HTTP.jl#1342): give it dedicated OS threads so in-process
      # mock servers are never starved by test-side work — the idle-gap
      # contracts assert second-scale margins. Public-repo Linux runners have
      # 4 vCPUs; use them.
      JULIA_NUM_THREADS: '4,2'
    # No provider API keys are set anywhere in this job: the gate is zero-spend.
    # Live provider calls are covered by a separate manual workflow, not by this
    # one. UNILM_RUN_JET is deliberately not set either — it gates an in-suite
    # JET testset kept for local use, and the analysis here is its own step
    # below, in its own process. Running it a second time inside the suite would
    # only add JET's load and analysis cost to the timing-sensitive streaming
    # and deadline tests.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      # The oracle for this gate. It runs in its own process, before the test
      # suite, and analyses the package exactly as `using UniLM` leaves it: no
      # coverage instrumentation, and none of the mock endpoints or test-only
      # method overloads that the behavioural test files define. Those widen
      # dispatch tables and change what inference concludes about package code,
      # so an analysis run after them would describe a method table no user ever
      # has. A separate process also keeps JET's own cost off the test suite,
      # whose streaming and deadline tests assert on wall-clock bounds.
      - name: JET whole-package analysis (freshly loaded package)
        shell: julia --color=yes --startup-file=no {0}
        run: |
          using Pkg, TOML
          Pkg.activate(; temp = true)
          Pkg.develop(PackageSpec(path = pwd()))
          # Analyse with the JET the test suite already pins, so the gate and the
          # suite can never drift onto different analysers. Pkg.compat accepts the
          # full compat syntax (ranges, comma lists) that PackageSpec(version=...)
          # does not.
          jet = TOML.parsefile(joinpath(pwd(), "test", "Project.toml"))["compat"]["JET"]
          Pkg.add("JET")
          Pkg.compat("JET", jet)
          Pkg.resolve()

          using UniLM, JET
          report = JET.report_package(UniLM;
              target_modules = (UniLM,),
              ignore_missing_comparison = true)
          findings = JET.get_reports(report)
          show(stdout, MIME"text/plain"(), report)
          println()
          println("JET package-code findings: ", length(findings))
          isempty(findings) || exit(1)

  release-tests:
    name: Test suite (latest stable Julia)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # HTTP.jl ≥ 2.6.2 schedules server tasks on the interactive thread pool
      # (JuliaWeb/HTTP.jl#1342): give it dedicated OS threads so in-process
      # mock servers are never starved by test-side work — the idle-gap
      # contracts assert second-scale margins. Public-repo Linux runners have
      # 4 vCPUs; use them.
      JULIA_NUM_THREADS: '4,2'
    # Keyless, like the JET job above: no provider API keys and no coverage
    # upload, so the gate stays zero-spend and runs without repository secrets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0

  local-models:
    name: Local models (real Ollama, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: '4,2'
      UNILM_LIVE_OLLAMA: '1'
      OLLAMA_VERSION: v0.40.7
      OLLAMA_SHA256: 7f082e625b4c334df84ed1558fe282d6d8091fe3545790aef30b3a9c50d44d41
      # The model-management suite also needs kev:0.8b-q8_0, which it names itself: keep it in this list.
      UNILM_OLLAMA_DECISION_MODELS: kev:0.8b-q8_0,d1-omni:600m
      # A build that sees and hears, so the embeddings suite's image, audio and mixed-item witnesses run.
      UNILM_OLLAMA_EMBED_MODELS: embeddinggemma-2:740m-q8_0
      UNILM_OLLAMA_EMBED_MODEL: embeddinggemma-2:740m-q8_0
      UNILM_OLLAMA_SCRATCH_MODEL: all-minilm:22m
    # Zero-spend like the other jobs: local models only, no keys, no Ollama Cloud.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
        with:
          # The token is read-only: deleting old caches would only fail and log the failure.
          delete-old-caches: false
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - name: Install Ollama (pinned by checksum)
        run: |
          f="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          curl -fsSL --retry 3 -o "$f" "https://github.com/ollama/ollama/releases/download/$OLLAMA_VERSION/ollama-linux-amd64.tar.zst"
          echo "$OLLAMA_SHA256  $f" | sha256sum -c -
          sudo tar --zstd -xf "$f" -C /usr/local
          rm -f "$f"
          (ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:11434/api/version && break; sleep 1; done
          # The server answering must be the pinned one, not another process on the port.
          test "$(curl -sf http://127.0.0.1:11434/api/version)" = "{\"version\":\"${OLLAMA_VERSION#v}\"}"
      - name: Pull the test models
        run: |
          # The model-management suite pulls and deletes the scratch model itself, and skips that witness
          # when the model is installed already: a run that pulls it here would never witness the delete.
          for m in ${UNILM_OLLAMA_DECISION_MODELS//,/ } ${UNILM_OLLAMA_EMBED_MODELS//,/ } "$UNILM_OLLAMA_EMBED_MODEL"; do
            if [ "$m" = "$UNILM_OLLAMA_SCRATCH_MODEL" ]; then
              echo "::error::$m is UNILM_OLLAMA_SCRATCH_MODEL, which the model-management suite pulls and deletes itself"
              exit 1
            fi
            ollama pull "$m"
          done
          ollama list
      - name: Local-model live suites
        shell: julia --color=yes --startup-file=no {0}
        run: |
          using Pkg; Pkg.activate("test"); Pkg.instantiate()     # test/Project.toml sources UniLM from ".."
          using Test, HTTP, JSON, UniLM, Sockets
          # Absolute paths: inside this script a relative include resolves against the
          # script's own directory (the runner's temp directory), not the checkout.
          @testset failfast=false "local models" begin
              include(joinpath(pwd(), "test", "integration_ollama_system_one.jl"))
              include(joinpath(pwd(), "test", "integration_ollama_embeddings.jl"))
              include(joinpath(pwd(), "test", "integration_ollama_models.jl"))
          end
          # A suite that took its offline branch skipped every witness and still passed.
          all(!isnothing, (_OS1L_EP, _OE_EP, _OMM_EP)) ||
              error("local models: every suite must run live in this job; one took its offline branch (UNILM_LIVE_OLLAMA)")
      - name: Ollama server log
        if: always()
        run: |
          cat "$RUNNER_TEMP/ollama.log" || true
          pkill -f 'ollama serve' || true
